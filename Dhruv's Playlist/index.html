<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DHRUV'S Mixtape</title>
  <meta name="description" content="DHRUV'S Mixtape — a running mix, always on." />
  <meta name="theme-color" content="#EFB044" />
  
  <!-- Open Graph / Social -->
  <meta property="og:title" content="DHRUV'S Mixtape" />
  <meta property="og:description" content="A running mix, always on." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/src/img/bg1.png" />
  
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="preload" as="image" href="src/img/bg1.png" />
</head>

<body>
  <div id="app">
    <!-- Background Slideshow -->
    <div class="hero-bg" id="hero-bg" aria-hidden="true">
      <div class="bg-slide active" data-bg="src/img/bg1.png"></div>
      <div class="bg-slide" data-bg="src/img/bg2.png"></div>
      <div class="bg-slide" data-bg="src/img/bg3.png"></div>
      <div class="bg-slide" data-bg="src/img/bg4.png"></div>
      <div class="bg-slide" data-bg="src/img/bg5.png"></div>
      <div class="bg-slide" data-bg="src/img/bg6.png"></div>
      <div class="bg-slide" data-bg="src/img/bg7.png"></div>
      <div class="bg-slide" data-bg="src/img/bg8.png"></div>
      <div class="hero-overlay"></div>
      <canvas id="effects-canvas" class="effects-canvas" aria-hidden="true"></canvas>
    </div>

    <!-- Top Left: Clock -->
    <time class="clock" id="clock" aria-live="off" aria-label="Current time"></time>

    <!-- Top Center: Online Users -->
    <div class="online-users" aria-live="polite" aria-atomic="true">
      <span class="dot-container" aria-hidden="true">
        <span class="dot-ping"></span>
        <span class="dot-solid"></span>
      </span>
      <span class="user-count" id="user-count">—</span>
      <span class="user-label">online</span>
    </div>

    <!-- Top Right: Social Links -->
    <nav class="social-links" aria-label="External music links">
      <a href="https://open.spotify.com/user/31q5chpbrnoxir332v5g2q4vxjea/playlists" target="_blank" rel="noopener noreferrer" class="pill-btn"
        aria-label="Open playlist on Spotify">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z" />
        </svg>
        <span class="link-text">Spotify</span>
        <svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
      <a href="https://music.youtube.com/@dhruvyoutube-rai?si=Reg3iqLkPJ-CRO-I" target="_blank"
        rel="noopener noreferrer" class="pill-btn" aria-label="Open playlist on YouTube Music">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z" />
        </svg>
        <span class="link-text">YT Music</span>
        <svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
      <button id="effects-toggle" class="pill-btn effects-btn" aria-label="Toggle visual effects" type="button" title="Visual Effects">
        <svg id="effect-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <span id="effect-label">Effects</span>
      </button>
    </nav>

    <!-- Center Title -->
    <div class="logo-container" aria-hidden="true">
      <h1 class="hero-title">
        <span class="hero-kicker" id="hero-kicker-text">DHRUV’S</span>
        <span class="hero-script" id="hero-script-text">Mixtape</span>
      </h1>
    </div>

    <!-- Screen reader track announcement -->
    <div id="sr-announce" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <!-- Bottom Player Container -->
    <div class="player-container">
      <!-- Song Selection Drawer -->
      <div class="playlist-drawer" id="playlist-drawer" role="dialog" aria-label="Song selection" aria-modal="false">
        <div class="drawer-header">
          <div class="drawer-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
            <div class="custom-select-wrapper" id="custom-playlist-select">
              <button class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false" type="button">
                <span class="custom-select-label">DHRUV'S Mixtape</span>
                <svg class="custom-select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <ul class="custom-select-options" role="listbox" aria-hidden="true">
                <li class="custom-select-option is-selected" role="option" aria-selected="true" data-value="PLCAxG7on8A6bgJEAbXvfstliUopl0ibrN">DHRUV'S Mixtape</li>
                <li class="custom-select-option" role="option" aria-selected="false" data-value="PLqulgEQug4aY4OH1t6u7JUdZpAZULZCKC">Bollywood Hits</li>
                <li class="custom-select-option" role="option" aria-selected="false" data-value="PLcOhy50QpGlst75-brVladLyiy0-sp7Dc">Sufi & Soulful</li>
                <li class="custom-select-option" role="option" aria-selected="false" data-value="PLZhk_SkrSopDvX7kjcayZTLJF9LwbiSYx">Dance</li>
                <li class="custom-select-option" role="option" aria-selected="false" data-value="PL3HnYRKfTBJVPJqjp0VZN3agpPEHX8An6">Love</li>
                <li class="custom-select-option" role="option" aria-selected="false" data-value="PLZ4BrZ6_G9NMP0krgYIEz0NEs5DTycBiz">Coke Studio & Mix</li>
                <li class="custom-select-option" role="option" aria-selected="false" data-value="PLDBY0HRfwJx44lDeLXGBTQJ7SFYCIN_e6">Mood Refreshing & Energetic</li>
              </ul>
            </div>
          </div>
          <button class="close-drawer-btn" id="close-drawer-btn" aria-label="Close song selection" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="drawer-search">
          <input type="search" id="playlist-search" class="playlist-search-input" placeholder="Search songs or artists..." aria-label="Search playlist">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <div class="song-list" id="song-list" role="listbox" aria-label="Playlist songs" tabindex="0"></div>
      </div>

      <!-- Player Card -->
      <div class="player-card" id="player-card" role="region" aria-label="Music player">
        <div class="album-art-container">
          <div class="album-art" id="album-art">
            <img id="album-art-img" src="" alt="" loading="lazy" draggable="false" />
          </div>
        </div>

        <div class="track-info">
          <div class="now-playing-label">NOW PLAYING</div>
          <h2 class="track-title"><span id="track-title">Select a song</span></h2>
          <p class="track-artist" id="track-artist">—</p>

          <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar" id="progress-bar" role="slider" aria-label="Seek" aria-valuemin="0"
              aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 of 0:00" tabindex="0">
              <div class="progress-bg"></div>
              <div class="progress-fill" id="progress-fill"></div>
              <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <div class="controls" role="toolbar" aria-label="Playback controls">
          <button class="control-btn" id="playlist-btn" aria-label="Open song selection" aria-expanded="false"
            aria-controls="playlist-drawer" type="button" title="Songs">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <line x1="3" y1="6" x2="3.01" y2="6" />
              <line x1="3" y1="12" x2="3.01" y2="12" />
              <line x1="3" y1="18" x2="3.01" y2="18" />
            </svg>
          </button>
          <button class="control-btn" id="shuffle-btn" aria-label="Toggle shuffle" type="button" title="Shuffle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
          </button>
          <button class="control-btn" id="prev-btn" aria-label="Previous track" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
          </button>
          <button class="control-btn play-btn" id="play-btn" aria-label="Play" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="play-icon" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="pause-icon" class="hidden"
              aria-hidden="true">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button class="control-btn" id="next-btn" aria-label="Next track" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z" />
            </svg>
          </button>
          <button class="control-btn" id="like-btn" aria-label="Like" type="button" title="Like">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="like-icon-outline">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="like-icon-filled" class="hidden">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
          <button class="control-btn" id="copy-btn" aria-label="Copy link" type="button" title="Copy Link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="copy-icon">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="check-icon" class="hidden">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
          <button class="control-btn volume-btn" id="volume-btn" aria-label="Mute" type="button" title="Volume">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="vol-icon-on">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="vol-icon-off" class="hidden">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <line x1="23" y1="9" x2="17" y2="15" />
              <line x1="17" y1="9" x2="23" y2="15" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden YouTube Player -->
  <div id="yt-player-wrapper" aria-hidden="true">
    <div id="yt-player"></div>
  </div>

  <script>
    // Load YouTube IFrame API
    (function () {
      var s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      s.async = true;
      document.head.appendChild(s);
    })();

    // Unregister any active Service Worker and clear stale cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      if (window.caches) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
    }
  </script>
  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
